name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Laravel ${{ matrix.laravel }} / PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - laravel: '11.x'
            php: '8.3'
            testbench: '^9.0'
          - laravel: '11.x'
            php: '8.4'
            testbench: '^9.0'
          - laravel: '11.x'
            php: '8.5'
            testbench: '^9.0'
          - laravel: '12.x'
            php: '8.3'
            testbench: '^10.0'
          - laravel: '12.x'
            php: '8.4'
            testbench: '^10.0'
          - laravel: '12.x'
            php: '8.5'
            testbench: '^10.0'
          - laravel: '13.x'
            php: '8.3'
            testbench: '^11.1'
          - laravel: '13.x'
            php: '8.4'
            testbench: '^11.1'
          - laravel: '13.x'
            php: '8.5'
            testbench: '^11.1'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          cache: composer
          tools: composer:v2

      - name: Validate baseline Composer configuration
        run: composer validate --strict --no-check-publish

      - name: Configure Private Packagist authentication
        env:
          PRIVATE_PACKAGIST_USERNAME: ${{ secrets.PRIVATE_PACKAGIST_USERNAME }}
          PRIVATE_PACKAGIST_TOKEN: ${{ secrets.PRIVATE_PACKAGIST_TOKEN }}
        run: composer config --global --auth http-basic.repo.packagist.com "${PRIVATE_PACKAGIST_USERNAME:-token}" "$PRIVATE_PACKAGIST_TOKEN"

      - name: Select matching Testbench version
        run: composer require --dev "orchestra/testbench:${{ matrix.testbench }}" --no-update --no-interaction

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress --with-all-dependencies --no-security-blocking

      - name: Validate resolved Composer configuration
        run: composer validate --strict --no-check-publish

      - name: Run checks
        run: composer ci
