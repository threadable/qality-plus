name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Laravel ${{ matrix.laravel }} / PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - laravel: '11.x'
            php: '8.3'
            testbench: '^9.0'
          - laravel: '11.x'
            php: '8.4'
            testbench: '^9.0'
          - laravel: '11.x'
            php: '8.5'
            testbench: '^9.0'
          - laravel: '12.x'
            php: '8.3'
            testbench: '^10.0'
          - laravel: '12.x'
            php: '8.4'
            testbench: '^10.0'
          - laravel: '12.x'
            php: '8.5'
            testbench: '^10.0'
          - laravel: '13.x'
            php: '8.3'
            testbench: '^11.1'
          - laravel: '13.x'
            php: '8.4'
            testbench: '^11.1'
          - laravel: '13.x'
            php: '8.5'
            testbench: '^11.1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Select matching Testbench version
        run: composer require --dev "orchestra/testbench:${{ matrix.testbench }}" --no-update --no-interaction

      - name: Validate Composer configuration
        run: composer validate --strict --no-check-publish

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress --with-all-dependencies --no-security-blocking

      - name: Run checks
        run: composer ci
