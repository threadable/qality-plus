name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Laravel ${{ matrix.laravel }} / PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - laravel: '11.x'
            php: '8.3'
            testbench: '^9.0'
          - laravel: '11.x'
            php: '8.4'
            testbench: '^9.0'
          - laravel: '11.x'
            php: '8.5'
            testbench: '^9.0'
          - laravel: '12.x'
            php: '8.3'
            testbench: '^10.0'
          - laravel: '12.x'
            php: '8.4'
            testbench: '^10.0'
          - laravel: '12.x'
            php: '8.5'
            testbench: '^10.0'
          - laravel: '13.x'
            php: '8.3'
            testbench: '^11.1'
          - laravel: '13.x'
            php: '8.4'
            testbench: '^11.1'
          - laravel: '13.x'
            php: '8.5'
            testbench: '^11.1'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Locate Composer cache
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-${{ matrix.php }}-composer-${{ hashFiles('composer.json', 'composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-${{ matrix.php }}-composer-

      - name: Validate baseline Composer configuration
        run: composer validate --strict --no-check-publish

      - name: Select matching Testbench version
        run: composer require --dev "orchestra/testbench:${{ matrix.testbench }}" --no-update --no-interaction

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress --with-all-dependencies --no-security-blocking

      - name: Validate resolved Composer configuration
        run: composer validate --strict --no-check-publish

      - name: Run checks
        run: composer ci
